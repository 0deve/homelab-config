services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1000:1000
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    ports:
      - 8096:8096
    volumes:
      - /home/odv/my-server/jellyfin/config:/config
      - /home/odv/my-server/jellyfin/cache:/cache
      - /home/odv/my-server/media:/media
      - /data_pool/data/media:/data/media
      - /data_pool/fulls:/fulls
    restart: unless-stopped
    networks:
      - retea_publica
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - video
networks:
  retea_publica:
    external: true
