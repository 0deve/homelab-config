services:
  discord-health-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    pid: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility]
    networks:
      - retea_publica
networks:
  retea_publica:
    external: true
