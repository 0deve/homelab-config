services:
  speedtest-tracker:
    container_name: speedtest-tracker
    image: lscr.io/linuxserver/speedtest-tracker:latest
    ports:
      - 8081:80
      - 8443:443
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Bucharest
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE='0 */4 * * *'
      - SPEEDTEST_SERVERS=11502
      - APP_TIMEZONE=Europe/Bucharest
      - DISPLAY_TIMEZONE=Europe/Bucharest
      - PRUNE_RESULTS_OLDER_THAN=30
    volumes:
      - /home/odv/my-server/speedtest-tracker:/config
    restart: unless-stopped
networks: {}
