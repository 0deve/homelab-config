server {
    listen 80;
    server_name www.filecodec.com;

    # redirect www to non-www
    return 301 https://filecodec.com$request_uri;
}

server {
    listen 80;
    server_name localhost filecodec.com;
    root /usr/share/nginx/html;

    index home.html index.html;

    # if someone tries to visit /home or /home.html redirect to root
    if ($request_uri ~* ^/home(\.html)?$) {
        return 301 /;
    }

    # force the browser to remove .html from all other urls
    if ($request_uri ~ ^/(.*)\.html$) {
        return 301 /$1;
    }

    # serve the correct file invisibly in the background
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
