services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80/tcp"
    environment:
      TZ: 'Europe/Bucharest'
      WEBPASSWORD: '${PIHOLE_WEBPASSWORD}'
    volumes:
      - /home/odv/my-server/pihole/etc-pihole:/etc/pihole
      - /home/odv/my-server/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped